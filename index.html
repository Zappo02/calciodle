  /* Dentro un iframe: classe sull'html e altezza inviata alla pagina madre */
  (function () {
    var inIframe;
    try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
    if (!inIframe) return;
    document.documentElement.className += " in-iframe";
    if (!("ResizeObserver" in window)) return;
    var ultima = 0;
    function invia() {
      var root = document.getElementById("root");
      if (!root) return;
      var h = Math.ceil(root.getBoundingClientRect().height);
      if (h > 0 && h !== ultima) {
        ultima = h;
        try { window.parent.postMessage({ type: "calciodle-height", height: h }, "*"); } catch (e) {}
      }
    }
    function avvia() {
      var root = document.getElementById("root");
      if (!root) return;
      new ResizeObserver(invia).observe(root);
      invia();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", avvia);
    else avvia();
  })();

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html[data-theme=dark] body{background:#070910}
html[data-theme=light] body{background:#f4f6fb}
.app{
  --radius:16px;
  min-height:100vh;min-height:100dvh;color:var(--text);overflow-x:clip;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;position:relative;transition:background .35s ease,color .35s ease;
}
html.in-iframe .app{min-height:660px}
.app.dark{
  --text:#ffffff;--muted:#97a1bd;--faint:#6f7a9c;--panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.11);--ok:#2fd98a;--ko:#ff5470;--gold:#ffb01f;--near:#e8b72c;--none:#2a3046;
  --on-ok:#04150d;--on-near:#1b1206;--on-none:#d5daea;--shadow:0 10px 34px rgba(0,0,0,.55);--solid:#10131f;
  color-scheme:dark;
  background:radial-gradient(90% 60% at 10% 0%,#16203a 0%,rgba(7,9,16,0) 60%),radial-gradient(90% 60% at 90% 100%,#241428 0%,rgba(7,9,16,0) 60%),#070910;
}
.app.light{
  --text:#111522;--muted:#5d6681;--faint:#7d869e;--panel:#ffffff;--panel-2:#f1f3fa;--line:rgba(17,21,34,.1);
  --ok:#0f9d58;--ko:#e0344f;--gold:#b8780a;--near:#e3a817;--none:#cfd4e2;
  --on-ok:#ffffff;--on-near:#1b1206;--on-none:#3a4158;--shadow:0 8px 26px rgba(17,21,34,.1);--solid:#ffffff;
  color-scheme:light;
  background:radial-gradient(90% 60% at 10% 0%,#e3ecff 0%,rgba(244,246,251,0) 62%),radial-gradient(90% 60% at 90% 100%,#ffe8ee 0%,rgba(244,246,251,0) 62%),#f4f6fb;
}
button{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* BARRA IN ALTO */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px;width:100%;max-width:640px;margin:0 auto}
.brand{font-size:9.5px;letter-spacing:.24em;color:var(--faint);font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.tool{width:34px;height:34px;border-radius:11px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .14s ease}
.tool:active{transform:scale(.92)}
.langsw{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:2px;box-shadow:var(--shadow)}
.langsw button{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:0 8px;height:28px;border-radius:9px;cursor:pointer}
.langsw button.on{background:var(--text);color:var(--solid)}

/* HOME */
.home{display:flex;flex-direction:column;padding:18px 16px 24px;max-width:520px;width:100%;margin:0 auto}
.title{font-size:clamp(38px,11vw,56px);line-height:1;margin:0;font-weight:800;letter-spacing:-.04em}
.amp{background:linear-gradient(90deg,var(--ok),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:.06em}
.tagline{color:var(--muted);font-size:13.5px;margin:10px 0 16px;line-height:1.45;max-width:46ch}
.demo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 18px}
.sect{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:800;margin:18px 0 9px;text-transform:uppercase}
.daily-card{width:100%;text-align:left;cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:linear-gradient(135deg,rgba(47,217,138,.14),rgba(255,176,31,.1)),var(--panel);box-shadow:var(--shadow);transition:transform .15s ease;display:flex;align-items:center;gap:14px}
.daily-card:active,.mode-card:active{transform:scale(.985)}
.daily-ico{font-size:24px;width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.daily-body{flex:1;min-width:0}
.daily-h{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:999px;background:var(--gold);color:#1b1206}
.pill.big{font-size:11px;padding:5px 11px;margin-top:12px;display:inline-block}
.daily-s{font-size:12px;color:var(--muted);margin-top:3px}
.daily-go,.mode-go{font-size:24px;color:var(--faint);line-height:1}
.modes{display:flex;flex-direction:column;gap:10px}
.mode-card{display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease}
.mode-card.col{flex-direction:column;align-items:stretch;gap:10px;cursor:default}
.mode-card.col:active{transform:none}
.mode-main{display:flex;align-items:center;gap:13px;background:none;border:0;color:inherit;padding:0;text-align:left;cursor:pointer;width:100%}
.mode-icon{font-size:20px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);flex:0 0 auto}
.mode-text{flex:1;min-width:0}
.mode-label{font-weight:700;font-size:15.5px}
.mode-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mode-rec{font-size:11.5px;color:var(--gold);font-weight:800;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:11px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-size:9.5px;font-weight:600;color:var(--faint)}
.seg button.on{border-color:var(--ok);color:var(--text);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.foot{margin-top:22px;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.05em;line-height:1.6}
.allgames{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 16%,transparent),color-mix(in srgb,var(--gold) 10%,transparent)),var(--panel);color:var(--text);font-weight:800;font-size:clamp(13px,3.7vw,15px);text-decoration:none;white-space:nowrap;box-shadow:var(--shadow);transition:transform .15s ease}
.allgames span{color:var(--ok)}
.allgames:active{transform:scale(.985)}

/* GIOCO */
.game{display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;padding:4px 16px 8px 8px;width:100%;max-width:640px;margin:0 auto;min-height:48px}
.hud-back{background:none;border:0;color:var(--muted);font-size:30px;line-height:1;cursor:pointer;padding:0 6px}
.hud-mode{font-size:12.5px;color:var(--muted);font-weight:700;flex:1;min-width:0;line-height:1.3}
.hud-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-count b{font-size:18px;color:var(--text)}
.hud-timer{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.hud-timer.low{color:var(--ko);animation:pulse 1s infinite}
.hud-score{display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-score b{font-size:18px}
.hud-score span{font-size:10px;color:var(--muted);font-weight:700}
.hud-lives{display:flex;gap:4px}
.hud-lives i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.hud-lives i.on{background:var(--ko);box-shadow:0 0 8px color-mix(in srgb,var(--ko) 60%,transparent)}
.timebar{height:3px;background:var(--line);width:100%;max-width:640px;margin:0 auto}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--ko),var(--gold));transition:width 1s linear}
.scroll{padding:8px 16px 28px;width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.lead{color:var(--muted);font-size:13px;line-height:1.45;margin:2px 0 4px}

.hints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hint{border:1px dashed var(--line);background:var(--panel);color:var(--muted);border-radius:11px;padding:7px 4px;font-size:11px;cursor:pointer;line-height:1.25;min-width:0;overflow-wrap:break-word}
.hint b{display:block;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:800}
.hint .cost{color:var(--gold);font-weight:800}
.hint.open{border-style:solid;border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--text);cursor:default;font-weight:700}
.hint:disabled:not(.open){opacity:.45;cursor:default}

.search{position:relative}
.search input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--text);font-size:16px;font-weight:600;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--faint);font-weight:500}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;list-style:none;margin:0;padding:5px;border-radius:14px;border:1px solid var(--line);background:var(--solid);box-shadow:var(--shadow);max-height:300px;overflow-y:auto}
.sugg li{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.sugg li.on{background:var(--panel-2)}
.s-flag{grid-row:1/3;font-size:20px;align-self:center}
.s-name{font-weight:700;font-size:14px}
.s-club{font-size:11.5px;color:var(--muted)}
.sugg-empty{font-size:12px;color:var(--muted);padding:8px 4px}

.colhead{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:center;margin-top:4px}
.guesses{display:flex;flex-direction:column;gap:9px}
.guess{display:flex;flex-direction:column;gap:5px}
.g-name{font-size:13px;font-weight:700;padding-left:2px}
.guess.win .g-name{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tile{min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;text-align:center;min-width:0;font-variant-numeric:tabular-nums}
.tile.ok{background:var(--ok);color:var(--on-ok)}
.tile.vicino{background:var(--near);color:var(--on-near)}
.tile.no{background:var(--none);color:var(--on-none)}
.tile.mini{min-height:40px}
.tile.mini .t-main{font-size:11px}
.t-main{font-weight:800;font-size:12.5px;line-height:1.1;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.t-club{font-size:10px}
.t-lega{font-size:11.5px}
.t-flag{font-size:22px;line-height:1}
.t-sub{font-size:9px;font-weight:700;opacity:.85;margin-top:2px;line-height:1.1;letter-spacing:.03em}
.t-arrow{font-size:12px;line-height:1;margin-top:2px}
.tile.flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
@keyframes pulse{50%{opacity:.55}}
.empty{border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:13px;line-height:1.45;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:11px;color:var(--faint);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.ok{background:var(--ok)}.sw.vicino{background:var(--near)}.sw.no{background:var(--none)}

.reveal,.over{border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));border-radius:var(--radius);padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 14%,transparent),transparent),var(--panel);box-shadow:var(--shadow);text-align:center}
.reveal.lost{border-color:color-mix(in srgb,var(--ko) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ko) 12%,transparent),transparent),var(--panel)}
.r-kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.r-name{font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.02em;margin-top:5px;text-wrap:balance}
.r-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.r-points{font-size:14px;font-weight:800;color:var(--gold);margin-top:8px}
.r-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer;background:var(--ok);color:var(--on-ok)}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.manual{margin-top:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.manual label{font-size:12px;color:var(--muted);font-weight:700}
.manual textarea{width:100%;resize:none;border-radius:10px;border:1px solid var(--line);background:var(--solid);color:var(--text);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:8px}
.countdown{font-size:12px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
.chainbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.chainbar b{color:var(--text)}
.link{background:none;border:0;color:var(--ko);font-weight:700;font-size:12px;cursor:pointer;padding:4px 0;white-space:nowrap}
.notice{font-size:12px;font-weight:700;color:var(--gold);text-align:center}
.over{margin-top:12px;padding:26px 18px}
.over-num{font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.over-lab{font-size:13px;color:var(--muted);font-weight:700}
.over-sub{font-size:13px;margin-top:10px}
.over-rec{font-size:12px;color:var(--gold);font-weight:800;margin-top:10px}
.over-last{font-size:13px;color:var(--muted);margin-top:12px}

.arch{display:flex;flex-direction:column;gap:6px}
.arch-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-align:left}
.a-num{font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.a-date{font-weight:700;font-size:14px}
.a-st{font-size:11.5px;color:var(--muted);text-align:right}
.arch-row.ok .a-st{color:var(--ok);font-weight:700}
.arch-row.ko .a-st{color:var(--ko)}
.arch-row.wip .a-st{color:var(--gold);font-weight:700}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,14,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:600px){.modal{align-items:center}}
html.in-iframe .modal{align-items:flex-start}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--solid);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px;box-shadow:var(--shadow)}
html.in-iframe .sheet{max-height:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.02em}
.x{background:none;border:0;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}
.sheet p{font-size:13.5px;line-height:1.5;color:var(--text)}
.sheet .fine{font-size:11.5px;color:var(--faint)}
.rules{padding-left:18px;font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:5px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-row div{background:var(--panel-2);border-radius:11px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;min-width:0}
.stat-row b{font-size:20px;font-variant-numeric:tabular-nums}
.stat-row span{font-size:10px;color:var(--muted);font-weight:700;line-height:1.2;overflow-wrap:break-word}
.distr{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.d-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.d-row span{width:12px;color:var(--muted)}
.d-row i{font-style:normal;background:var(--none);color:var(--on-none);border-radius:5px;padding:2px 7px;text-align:right;font-size:11px}
.d-row i.has{background:var(--ok);color:var(--on-ok)}

@media (max-width:380px){.t-main{font-size:10.5px}.t-club{font-size:9px}.t-lega{font-size:10px}.tile{min-height:50px}.hint{font-size:10px}.hint b{font-size:8.5px;letter-spacing:.02em}.brand{letter-spacing:.16em}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
